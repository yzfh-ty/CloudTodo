name: client_flutter
description: CloudTodo Flutter client for Web, Android, and Windows.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: DroidSansFallback
      fonts:
        - asset: assets/fonts/DroidSansFallbackFull.ttf
