services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudtodo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - cloudtodo-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudtodo-server
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: CloudTodo Server
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY is required}
      PASSWORD_RESET_TOKEN_SECRET: ${PASSWORD_RESET_TOKEN_SECRET:?PASSWORD_RESET_TOKEN_SECRET is required}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_SCAN_INTERVAL_MS: ${SCHEDULER_SCAN_INTERVAL_MS:-5000}
      DELIVERY_SCAN_INTERVAL_MS: ${DELIVERY_SCAN_INTERVAL_MS:-5000}
      DELIVERY_MAX_ATTEMPTS: ${DELIVERY_MAX_ATTEMPTS:-3}
      DELIVERY_PROCESSING_LEASE_MS: ${DELIVERY_PROCESSING_LEASE_MS:-60000}
      WEBHOOK_REQUEST_TIMEOUT_MS: ${WEBHOOK_REQUEST_TIMEOUT_MS:-5000}
      WEBHOOK_RESPONSE_MAX_BYTES: ${WEBHOOK_RESPONSE_MAX_BYTES:-2000}
      WEBHOOK_REQUEST_MAX_BYTES: ${WEBHOOK_REQUEST_MAX_BYTES:-262144}
      WEBHOOK_ALLOWED_PORTS: ${WEBHOOK_ALLOWED_PORTS:-443}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: "false"
      WEBHOOK_MAX_ENDPOINTS_PER_USER: ${WEBHOOK_MAX_ENDPOINTS_PER_USER:-10}
      WEBHOOK_MAX_ENDPOINTS_PER_HOST_PER_USER: ${WEBHOOK_MAX_ENDPOINTS_PER_HOST_PER_USER:-3}
      WEBHOOK_TESTS_PER_WINDOW: ${WEBHOOK_TESTS_PER_WINDOW:-5}
      WEBHOOK_TEST_WINDOW_MS: ${WEBHOOK_TEST_WINDOW_MS:-900000}
      WEBHOOK_GLOBAL_HOST_TESTS_PER_WINDOW: ${WEBHOOK_GLOBAL_HOST_TESTS_PER_WINDOW:-100}
      WEBHOOK_CREATES_PER_WINDOW: ${WEBHOOK_CREATES_PER_WINDOW:-5}
      WEBHOOK_CREATE_WINDOW_MS: ${WEBHOOK_CREATE_WINDOW_MS:-3600000}
      WEBHOOK_GLOBAL_HOST_CREATES_PER_WINDOW: ${WEBHOOK_GLOBAL_HOST_CREATES_PER_WINDOW:-100}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cloudtodo-postgres-data:
