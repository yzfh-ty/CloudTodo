name: Server CI

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: server/go.sum
      - run: gofmt -d cmd internal
      - run: go vet ./...
      - run: go test ./...
      - run: go build .