name: Server CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudtodo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudtodo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      APP_NAME: CloudTodo Server
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cloudtodo_test?schema=public
      # The sync watermark suite reads its own variable and is silently
      # skipped without it.
      SYNC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cloudtodo_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      WEBHOOK_SIGNING_SECRET: test-webhook-secret
      ADMIN_SESSION_SECRET: test-admin-session-secret
      CSRF_SECRET: test-csrf-secret
      WEBHOOK_SECRET_ENCRYPTION_KEY: test-webhook-secret-encryption-key
      PASSWORD_RESET_TOKEN_SECRET: test-password-reset-token-secret
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:3000
      SCHEDULER_ENABLED: false
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run lint

      - name: Build server
        run: npm run build

      - name: Check production configuration rejects unsafe values
        run: >-
          node -e "process.env.NODE_ENV='production';
          for (const key of ['JWT_ACCESS_SECRET','JWT_REFRESH_SECRET','WEBHOOK_SIGNING_SECRET','ADMIN_SESSION_SECRET','CSRF_SECRET','WEBHOOK_SECRET_ENCRYPTION_KEY','PASSWORD_RESET_TOKEN_SECRET']) process.env[key]='change-me';
          try { require('./dist/src/common/config/production-guard').assertProductionSecrets(); process.exit(1); }
          catch (error) { process.stdout.write(String(error.message)); }"
